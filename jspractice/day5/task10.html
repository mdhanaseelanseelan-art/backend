<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> js Document</title>
</head>
<body>
    <h1>
   Extract only employee names using map()
    </h1>
    <script>
             let employees = [
    { id: 1, name: "Arun", salary: 25000 },
    { id: 2, name: "Bala", salary: 35000 },
    { id: 3, name: "Kumar", salary: 45000 }
    ];

    let result = employees.map(emp => emp.name);

    console.log(result);
    </script>
    
</body>
</html>
