<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> js Document</title>
</head>
<body>
    <h1>Find employees earning more than ₹30,000 using filter()</h1>
    <script>
        let employees = [
    { name: "Arun", salary: 25000 },
    { name: "Bala", salary: 35000 },
    { name: "Kumar", salary: 45000 },
    { name: "Ravi", salary: 28000 }
    ];

    let result = employees.filter(emp => emp.salary > 30000);

    console.log(result);
    </script>
    
</body>
</html>
