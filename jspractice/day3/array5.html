<body>
    <h1>positive or negative</h1>
    <script>
      let arr =[-2,5,-8,10,0]
        for(let a=0; a<arr.length; a++){
           if(arr[a]>0){
              console.log(arr[a],"positive");
                
          }
          if (arr[a]<0) {
            console.log(arr[a],"negative");
            
            
          }
        if (arr[a]===0) {
            console.log(arr[a]);
            
        }
         }
    </script>
</body>
