<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js practice</title>
</head>
<body>
    <h1>Check whether all students scored above 50 using every().</h1>
    <script>
        let marks = [60, 75, 80, 90, 45];

        let result = marks.every(mark => mark > 50);

         console.log(result);
    </script>
    
</body>
</html>
