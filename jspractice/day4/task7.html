<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <h1>Find a student by ID using find()</h1>
    <script>
        let students = [
    { id: 101, name: "Arun" },
    { id: 102, name: "Bala" },
    { id: 103, name: "Kumar" }
    ];

    let result = students.find(student => student.id === 102);

     console.log(result);
    </script>
    
</body>
</html>
