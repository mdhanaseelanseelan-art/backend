<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js practice</title>
</head>
<body>
    <h1>Calculate the total salary of five employees using reduce()</h1>
    <script>
        let salaries = [20000, 25000, 30000, 35000, 40000];

         let total = salaries.reduce((sum, salary) => {
           return sum + salary;
          }, 0);

          console.log(total);
    </script>
    
</body>
</html>
