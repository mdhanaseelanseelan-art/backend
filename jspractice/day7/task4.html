<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> js Document</title>
</head>
<body>
    <h1>Product Price Calculation</h1>
    <script>
        let price = 5000;

      let discount = new Promise((resolve, reject) => {

    if (price <= 0) {
        reject("Invalid Product Price");
    } else {

        let discountAmount = price * 10 / 100;

        let finalPrice = price - discountAmount;

        resolve(finalPrice);
    }

   });

   discount
    .then((result) => {
        console.log("Discounted Price:", result);
    })
    .catch((error) => {
        console.log(error);
    })
    .finally(() => {
        console.log("Price Calculation Completed");
    });
    </script>
</body>
</html>
